<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gopal Bajpai | Cinematic Video Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --brand-blue: #3b82f6;
            --brand-purple: #8b5cf6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030303; 
            color: #ffffff;
            overflow-x: hidden;
            /* Added a subtle background gradient for depth */
            background-image: radial-gradient(circle at 50% 0%, rgba(29, 78, 216, 0.05) 0%, transparent 70%);
        }

        /* Only hide cursor on non-touch devices */
        @media (hover: hover) and (pointer: fine) {
            body, a, button, [role="button"] { cursor: none; }
        }

        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .text-gradient { 
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .rotate-slow {
            animation: spin 15s linear infinite;
        }

        /* Minimalist Modern Cursor */
        #custom-cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        #custom-cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .animate-scroll {
            animation: scroll 40s linear infinite;
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ModernCursor = () => {
            const [position, setPosition] = useState({ x: -100, y: -100 });
            const [ringPosition, setRingPosition] = useState({ x: -100, y: -100 });
            const [isPointer, setIsPointer] = useState(false);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                // Check if device supports hover
                if (!window.matchMedia("(hover: hover)").matches) return;
                
                setIsVisible(true);
                let requestRef;

                const handleMove = (e) => {
                    setPosition({ x: e.clientX, y: e.clientY });
                    
                    const target = e.target;
                    setIsPointer(
                        window.getComputedStyle(target).cursor === 'pointer' || 
                        ['A', 'BUTTON', 'INPUT'].includes(target.tagName) ||
                        target.closest('a') || target.closest('button')
                    );
                };

                const animateRing = () => {
                    setRingPosition(prev => {
                        const dx = position.x - prev.x;
                        const dy = position.y - prev.y;
                        return {
                            x: prev.x + dx * 0.2, // smoothing factor
                            y: prev.y + dy * 0.2
                        };
                    });
                    requestRef = requestAnimationFrame(animateRing);
                };

                window.addEventListener('mousemove', handleMove);
                requestRef = requestAnimationFrame(animateRing);

                return () => {
                    window.removeEventListener('mousemove', handleMove);
                    cancelAnimationFrame(requestRef);
                };
            }, [position]);

            if (!isVisible) return null;

            return (
                <>
                    <div id="custom-cursor-dot" style={{
                        left: `${position.x}px`,
                        top: `${position.y}px`,
                        backgroundColor: isPointer ? '#60a5fa' : 'white',
                        transform: `translate(-50%, -50%) scale(${isPointer ? 0.5 : 1})`
                    }} />
                    <div id="custom-cursor-ring" style={{
                        left: `${ringPosition.x}px`,
                        top: `${ringPosition.y}px`,
                        width: isPointer ? '60px' : '40px',
                        height: isPointer ? '60px' : '40px',
                        borderColor: isPointer ? 'rgba(96, 165, 250, 0.5)' : 'rgba(255, 255, 255, 0.4)'
                    }} />
                </>
            );
        };

        const MarqueeStrap = () => (
            <div className="relative py-8 bg-gradient-to-r from-blue-900/20 via-purple-900/20 to-blue-900/20 overflow-hidden select-none border-y border-white/5 my-16 backdrop-blur-sm">
                <div className="flex animate-scroll whitespace-nowrap">
                    {[1, 2, 3].map((i) => (
                        <div key={i} className="flex items-center gap-16 px-8">
                            {["Video Editor", "Videographer", "Cinematography", "Wedding Films", "Reel Mastery", "Brand Promotions", "Digital Storyteller"].map((service, index) => (
                                <div key={index} className="flex items-center gap-16">
                                    <span className="text-white/80 font-black text-4xl uppercase tracking-tighter italic">{service}</span>
                                    <i data-lucide="sparkle" className="w-8 h-8 text-blue-400"></i>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            </div>
        );

        const RotatingBadge = () => (
            <div className="absolute -top-12 -right-12 w-48 h-48 z-30 pointer-events-none select-none lg:flex hidden items-center justify-center drop-shadow-2xl">

                    <defs>
                        <path id="circlePath" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" />
                    </defs>
                    <text className="fill-white/80 text-[14px] font-black uppercase tracking-[0.3em]">
                        <textPath href="#circlePath">
                            Video Editor • Videographer •&nbsp;
                            Video Editor • Videographer •&nbsp;
                        </textPath>
                    </text>
                </svg>
                <div className="absolute w-4 h-4 bg-blue-500 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.8)]"></div>
            </div>
        );

        const Nav = ({ scrolled }) => (
            <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'py-4 bg-[#030303]/80 backdrop-blur-xl border-b border-white/5 shadow-2xl' : 'py-8 bg-transparent'}`}>
                <div className="max-w-7xl mx-auto px-6 md:px-8 flex justify-between items-center">
                    <div className="group">
                        <span className="text-sm font-black tracking-[0.3em] uppercase group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-blue-400 group-hover:to-purple-400 transition-all duration-300">Gopal Bajpai</span>
                    </div>
                    <div className="hidden md:flex items-center gap-10 text-[12px] font-bold uppercase tracking-[0.2em] text-gray-400">
                        <a href="#about" className="hover:text-white transition-colors">About</a>
                        <a href="#cinematic" className="hover:text-white transition-colors">Cinematic</a>
                        <a href="#reels" className="hover:text-white transition-colors">Reels</a>
                        <a href="#brands" className="hover:text-white transition-colors">Clients</a>
                        <a href="https://wa.me/919997036033" className="px-6 py-3 bg-white text-black rounded-full hover:bg-blue-600 hover:text-white transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(37,99,235,0.2)]">Let's Talk</a>
                    </div>
                </div>
            </nav>
        );

        const App = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                    document.querySelectorAll('.reveal').forEach(el => {
                        if (el.getBoundingClientRect().top < window.innerHeight * 0.85) {
                            el.classList.add('visible');
                        }
                    });
                };
                window.addEventListener('scroll', handleScroll);
                handleScroll(); // Trigger on mount
                
                // Initialize icons
                if (window.lucide) window.lucide.createIcons();
                
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Re-run lucide icons if components update
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const reelProjects = [
                { title: "Bhaarat", category: "Cinematic Narrative", icon: "map-pin", link: "https://www.instagram.com/reel/DR03rI7kgQF/" },
                { title: "Ring Ceremony", category: "Event Highlights", icon: "gem", link: "https://www.instagram.com/reel/DPdg3ZqE8Ti/" },
                { title: "Paan Kunwar School", category: "Education", icon: "graduation-cap", link: "https://www.instagram.com/reel/DXVabjWEi5W/" },
                { title: "Free Fire Events", category: "FF Community", icon: "gamepad-2", link: "https://www.instagram.com/reel/DXmb2unAYWX/" },
                { title: "Hotel Promo", category: "Hospitality", icon: "hotel", link: "https://www.instagram.com/reel/DW-pgz2kULc/" },
                { title: "Model Shoot", category: "Fashion", icon: "camera", link: "https://www.instagram.com/reel/DT-CVLVgQh0/" },
                { title: "School Memory", category: "Lifestyle", icon: "heart", link: "https://www.instagram.com/reel/DTHzI41kxRP/" },
                { title: "Dipawali Edit", category: "Cinematic Special", icon: "sparkles", link: "https://www.instagram.com/reel/DQAgXNakxAA/" },
                { title: "Sweet Special Edits", category: "Creative Edit", icon: "utensils", link: "https://www.instagram.com/reel/DWvAMppgRbK/" },
                { title: "Brij Mithas Promo", category: "Brand Story", icon: "tag", link: "https://www.instagram.com/reel/DQ5u5-iEpeR/" }
            ];

            return (
                <div className="selection:bg-blue-500/30 selection:text-white">
                    <ModernCursor />
                    <Nav scrolled={scrolled} />

                    {/* Hero */}
                    <section className="relative min-h-screen flex items-center pt-28 pb-16 overflow-hidden">
                        {/* Ambient Glow */}
                        <div className="absolute top-1/3 -left-32 w-[30rem] h-[30rem] bg-blue-600/20 blur-[150px] rounded-full mix-blend-screen pointer-events-none" />
                        <div className="absolute bottom-1/3 -right-32 w-[30rem] h-[30rem] bg-purple-600/10 blur-[150px] rounded-full mix-blend-screen pointer-events-none" />
                        
                        <div className="max-w-7xl mx-auto px-6 md:px-8 w-full grid lg:grid-cols-2 gap-16 items-center relative z-10">
                            <div className="reveal visible">
                                <h1 className="text-6xl md:text-8xl lg:text-[7.5rem] font-black leading-[0.9] tracking-tighter mb-8 text-white">
                                    CINEMA <br />
                                    <span className="text-gradient">CRAFTED.</span>
                                </h1>
                                <p className="text-lg md:text-xl text-gray-400 max-w-lg mb-10 leading-relaxed font-medium">
                                    I am <span className="text-white font-bold">Gopal Bajpai</span>. Transforming curiosity into visual impact since Q4 2023.
                                </p>
                                <div className="flex flex-col sm:flex-row flex-wrap gap-6 items-start sm:items-center">
                                    <a href="#cinematic" className="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold transition-all duration-300 shadow-[0_0_30px_rgba(37,99,235,0.3)] hover:shadow-[0_0_40px_rgba(37,99,235,0.5)] flex items-center gap-3 transform hover:-translate-y-1">
                                        View Shoots <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                    </a>
                                    <div className="flex items-center">
                                        <div className="flex -space-x-4">
                                            {[1, 2, 3].map((_, i) => (
                                                <div key={i} className="w-12 h-12 rounded-full border-2 border-[#030303] bg-gray-800 overflow-hidden flex items-center justify-center">
                                                    <i data-lucide="user" className="w-6 h-6 text-gray-500"></i>
                                                </div>
                                            ))}
                                        </div>
                                        <span className="pl-6 text-sm text-gray-400 font-bold uppercase tracking-wider">Trusted by 20+ Creators</span>
                                    </div>
                                </div>
                            </div>
                            <div className="relative reveal visible delay-200 mt-10 lg:mt-0">
                                <RotatingBadge />
                                <div className="aspect-[4/5] rounded-[2rem] overflow-hidden glass p-3 group shadow-2xl relative">
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    <img 
                                        src="profile.jpeg" 
                                        alt="Gopal Bajpai"
                                        className="w-full h-full object-cover rounded-[1.5rem] grayscale-[0.8] group-hover:grayscale-0 transition-all duration-700 scale-100 group-hover:scale-105"
                                        onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?q=80&w=800'; }}
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    <MarqueeStrap />

                    {/* About Section */}
                    <section id="about" className="py-24 relative">
                        <div className="max-w-7xl mx-auto px-6 md:px-8 grid lg:grid-cols-2 gap-16 lg:gap-24 items-center">
                            <div className="reveal">
                                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 glass text-blue-400 text-[10px] font-black uppercase tracking-[0.2em] mb-8">
                                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> About Me
                                </div>
                                <h2 className="text-4xl md:text-6xl font-black mb-8 leading-[1.1] text-white uppercase tracking-tighter">
                                    A JOYFUL RIDE <br/>THROUGH <span className="text-gradient italic">THE LENS.</span>
                                </h2>
                                <div className="space-y-6 text-gray-400 text-lg leading-relaxed font-medium">
                                    <p>My journey began in Q4 2023. It started with simple curiosity while watching people work offline, which quickly evolved into a passion-fueled career.</p>
                                    <p>From collaborating with <span className="text-white font-semibold">agencies</span> and <span className="text-white font-semibold">restaurants</span> to working within the <span className="text-blue-400 font-bold italic">Free Fire community</span> and the <span className="text-purple-400 font-bold italic">Gram App</span>, it's been an incredible ride of growth and creativity.</p>
                                    <p>I specialize in crafting high-retention narratives using industry-standard tools.</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4 md:gap-6 reveal delay-200">
                                {[
                                    { name: "Premiere Pro", icon: "video", color: "text-blue-400", bg: "bg-blue-400/10" },
                                    { name: "After Effects", icon: "layers", color: "text-purple-400", bg: "bg-purple-400/10" },
                                    { name: "CapCut Pro", icon: "scissors", color: "text-white", bg: "bg-white/10" },
                                    { name: "Photoshop", icon: "image", color: "text-blue-600", bg: "bg-blue-600/10" }
                                ].map((tool, i) => (
                                    <div key={i} className="p-6 md:p-8 glass rounded-3xl border border-white/5 hover:border-blue-500/30 transition-all duration-300 group hover:-translate-y-2 hover:bg-white/[0.02]">
                                        <div className={`w-14 h-14 mb-6 flex items-center justify-center rounded-2xl ${tool.bg} ${tool.color} group-hover:scale-110 transition-transform duration-300`}>
                                            <i data-lucide={tool.icon} className="w-6 h-6"></i>
                                        </div>
                                        <h4 className="text-lg md:text-xl font-black text-white">{tool.name}</h4>
                                        <p className="text-[10px] text-gray-500 font-bold uppercase mt-2 tracking-widest">Expertise</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Cinematic Shoots Section */}
                    <section id="cinematic" className="py-24 relative">
                        <div className="absolute inset-0 bg-gradient-to-b from-transparent via-blue-900/5 to-transparent pointer-events-none"></div>
                        <div className="max-w-7xl mx-auto px-6 md:px-8 relative z-10">
                            <div className="mb-20 reveal text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-6">
                                <div>
                                    <h2 className="text-5xl md:text-7xl font-black text-white uppercase tracking-tighter mb-4">CINEMATIC <br/><span className="text-gradient">SHOOTS</span></h2>
                                    <p className="text-gray-500 font-bold uppercase tracking-[0.3em] text-xs md:text-sm">Storytelling in every frame</p>
                                </div>
                                <div className="hidden md:block">
                                    <i data-lucide="film" className="w-16 h-16 text-white/10"></i>
                                </div>
                            </div>

                            <div className="space-y-32">
                                {/* Pre-Wedding Shoot */}
                                <div className="grid lg:grid-cols-5 gap-12 items-center reveal">
                                    <div className="lg:col-span-3 rounded-[2rem] overflow-hidden glass p-2 aspect-video group relative">
                                        <div className="absolute inset-0 z-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/20 pointer-events-none">
                                            <div className="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center">
                                                <i data-lucide="play" className="w-6 h-6 text-white fill-white ml-1"></i>
                                            </div>
                                        </div>
                                        <video 
                                            src="prewedding.mp4" 
                                            className="w-full h-full object-cover rounded-[1.5rem] transition-transform duration-1000 group-hover:scale-105"
                                            autoPlay loop muted playsInline
                                        />
                                    </div>
                                    <div className="lg:col-span-2">
                                        <div className="flex items-center gap-4 mb-6">
                                            <span className="w-8 h-1 bg-blue-500"></span>
                                            <span className="text-blue-400 font-bold tracking-widest uppercase text-xs">Featured Work</span>
                                        </div>
                                        <h3 className="text-3xl md:text-4xl font-black text-white mb-6 uppercase italic tracking-tighter">Pre-Wedding Shoot</h3>
                                        <p className="text-gray-400 text-lg leading-relaxed mb-8">
                                            Focusing on capturing the raw emotion and chemistry between the couple through a cinematic landscape lens. Every frame tells a piece of their unique story.
                                        </p>
                                        <div className="flex flex-wrap gap-3">
                                            <span className="px-5 py-2.5 rounded-full glass border-white/10 text-white/80 text-[11px] font-bold uppercase tracking-wider">Color Graded</span>

                    </section>

                    {/* Reel Mastery */}
                    <section id="reels" className="py-24">

                            <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">

                                        <div className="flex justify-between items-start mb-4">

                    {/* Brands Section */}
